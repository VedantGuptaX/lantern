apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-70b-server
  namespace: ml
  labels:
    lantern.dev/managed: "true"
    lantern.dev/service: llama-70b-server
    lantern.dev/team: ml-platform
spec:
  selector:
    matchLabels:
      app: llama-70b-server
  namespaceSelector:
    matchNames:
      - ml
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      metricRelabelings:
        - action: labeldrop
          regex: email|request_id|session_id|user_id
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llama-70b-server-slo
  namespace: ml
  labels:
    lantern.dev/managed: "true"
    lantern.dev/service: llama-70b-server
    lantern.dev/team: ml-platform
spec:
  groups:
    - name: lantern-sli-recordings-llama-70b-server-ttft
      rules:
        - record: lantern:sli_error:ratio_rate5m
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[5m]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[5m]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[5m]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 5m
            team: ml-platform
        - record: lantern:sli_error:ratio_rate30m
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[30m]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[30m]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[30m]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 30m
            team: ml-platform
        - record: lantern:sli_error:ratio_rate1h
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1h]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[1h]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1h]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 1h
            team: ml-platform
        - record: lantern:sli_error:ratio_rate2h
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[2h]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[2h]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[2h]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 2h
            team: ml-platform
        - record: lantern:sli_error:ratio_rate6h
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[6h]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[6h]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[6h]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 6h
            team: ml-platform
        - record: lantern:sli_error:ratio_rate1d
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1d]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[1d]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1d]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 1d
            team: ml-platform
        - record: lantern:sli_error:ratio_rate3d
          expr: |-
            (
              sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[3d]))
              -
              sum(rate(vllm:time_to_first_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.5"}[3d]))
            )
            /
            sum(rate(vllm:time_to_first_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[3d]))
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            lantern_window: 3d
            team: ml-platform
    - name: lantern-slo-meta-recordings-llama-70b-server-ttft
      rules:
        - record: lantern:objective:ratio
          expr: "0.99"
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            team: ml-platform
        - record: lantern:error_budget:ratio
          expr: "0.01"
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            team: ml-platform
        - record: lantern:time_period:days
          expr: "7"
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            team: ml-platform
        - record: lantern:current_burn_rate:ratio
          expr: |-
            lantern:sli_error:ratio_rate5m{lantern_id="llama-70b-server-ttft"}
            / on(lantern_id) group_left
            lantern:error_budget:ratio{lantern_id="llama-70b-server-ttft"}
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            team: ml-platform
        - record: lantern:period_error_budget_remaining:ratio
          expr: |-
            1 - (
              lantern:sli_error:ratio_rate3d{lantern_id="llama-70b-server-ttft"}
              / on(lantern_id) group_left
              lantern:error_budget:ratio{lantern_id="llama-70b-server-ttft"}
            )
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            team: ml-platform
    - name: lantern-slo-alerts-llama-70b-server-ttft
      rules:
        - alert: Llama70bServerTtftSLOBurnCritical
          expr: |-
            (
              lantern:sli_error:ratio_rate5m{lantern_id="llama-70b-server-ttft"} > (0.144)
              and
              lantern:sli_error:ratio_rate1h{lantern_id="llama-70b-server-ttft"} > (0.144)
            )
            or
            (
              lantern:sli_error:ratio_rate30m{lantern_id="llama-70b-server-ttft"} > (0.06)
              and
              lantern:sli_error:ratio_rate6h{lantern_id="llama-70b-server-ttft"} > (0.06)
            )
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            severity: critical
            team: ml-platform
          annotations:
            summary: llama-70b-server is burning its ttft error budget too fast
            description: "SLO \"ttft\" (objective 99% over 7d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 5m/1h at 14.4x, 30m/6h at 6x."
            runbook_url: https://runbooks.internal/slo/llama-70b-server-ttft
        - alert: Llama70bServerTtftSLOBurnWarning
          expr: |-
            (
              lantern:sli_error:ratio_rate2h{lantern_id="llama-70b-server-ttft"} > (0.03)
              and
              lantern:sli_error:ratio_rate1d{lantern_id="llama-70b-server-ttft"} > (0.03)
            )
            or
            (
              lantern:sli_error:ratio_rate6h{lantern_id="llama-70b-server-ttft"} > (0.01)
              and
              lantern:sli_error:ratio_rate3d{lantern_id="llama-70b-server-ttft"} > (0.01)
            )
          labels:
            lantern_id: llama-70b-server-ttft
            lantern_service: llama-70b-server
            lantern_slo: ttft
            severity: warning
            team: ml-platform
          annotations:
            summary: llama-70b-server is burning its ttft error budget too fast
            description: "SLO \"ttft\" (objective 99% over 7d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 2h/1d at 3x, 6h/3d at 1x."
            runbook_url: https://runbooks.internal/slo/llama-70b-server-ttft
    - name: lantern-sli-recordings-llama-70b-server-inter-token-latency
      rules:
        - record: lantern:sli_error:ratio_rate5m
          expr: |-
            (
              sum(rate(vllm:time_per_output_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[5m]))
