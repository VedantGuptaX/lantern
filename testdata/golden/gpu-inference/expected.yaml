              -
              sum(rate(vllm:time_per_output_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.05"}[6h]))
            )
            /
            sum(rate(vllm:time_per_output_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[6h]))
          labels:
            lantern_id: llama-70b-server-inter-token-latency
            lantern_service: llama-70b-server
            lantern_slo: inter-token-latency
            lantern_window: 6h
            team: ml-platform
        - record: lantern:sli_error:ratio_rate1d
          expr: |-
            (
              sum(rate(vllm:time_per_output_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1d]))
              -
              sum(rate(vllm:time_per_output_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.05"}[1d]))
            )
            /
            sum(rate(vllm:time_per_output_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[1d]))
          labels:
            lantern_id: llama-70b-server-inter-token-latency
            lantern_service: llama-70b-server
