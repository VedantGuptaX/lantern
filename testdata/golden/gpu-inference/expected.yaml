              -
              sum(rate(vllm:time_per_output_token_seconds_bucket{job="ml/llama-70b-server", namespace="ml", le="0.05"}[30m]))
            )
            /
            sum(rate(vllm:time_per_output_token_seconds_count{job="ml/llama-70b-server", namespace="ml"}[30m]))
          labels:
