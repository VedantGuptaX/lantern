            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            team: ml-platform
        - record: lantern:time_period:days
          expr: "7"
          labels:
            lantern_id: llama-70b-server-queue-depth
            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            team: ml-platform
        - record: lantern:current_burn_rate:ratio
          expr: |-
            lantern:sli_error:ratio_rate5m{lantern_id="llama-70b-server-queue-depth"}
            / on(lantern_id) group_left
            lantern:error_budget:ratio{lantern_id="llama-70b-server-queue-depth"}
          labels:
            lantern_id: llama-70b-server-queue-depth
            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            team: ml-platform
        - record: lantern:period_error_budget_remaining:ratio
          expr: |-
            1 - (
              lantern:sli_error:ratio_rate3d{lantern_id="llama-70b-server-queue-depth"}
              / on(lantern_id) group_left
              lantern:error_budget:ratio{lantern_id="llama-70b-server-queue-depth"}
            )
          labels:
            lantern_id: llama-70b-server-queue-depth
            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            team: ml-platform
    - name: lantern-slo-alerts-llama-70b-server-queue-depth
      rules:
        - alert: Llama70bServerQueueDepthSLOBurnCritical
          expr: |-
            (
              lantern:sli_error:ratio_rate5m{lantern_id="llama-70b-server-queue-depth"} > (0.144)
              and
              lantern:sli_error:ratio_rate1h{lantern_id="llama-70b-server-queue-depth"} > (0.144)
            )
            or
            (
              lantern:sli_error:ratio_rate30m{lantern_id="llama-70b-server-queue-depth"} > (0.06)
              and
              lantern:sli_error:ratio_rate6h{lantern_id="llama-70b-server-queue-depth"} > (0.06)
            )
          labels:
            lantern_id: llama-70b-server-queue-depth
            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            severity: critical
            team: ml-platform
          annotations:
            summary: llama-70b-server is burning its queue-depth error budget too fast
            description: "SLO \"queue-depth\" (objective 99% over 7d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 5m/1h at 14.4x, 30m/6h at 6x."
            runbook_url: https://runbooks.internal/slo/llama-70b-server-queue-depth
        - alert: Llama70bServerQueueDepthSLOBurnWarning
          expr: |-
            (
              lantern:sli_error:ratio_rate2h{lantern_id="llama-70b-server-queue-depth"} > (0.03)
              and
              lantern:sli_error:ratio_rate1d{lantern_id="llama-70b-server-queue-depth"} > (0.03)
            )
            or
            (
              lantern:sli_error:ratio_rate6h{lantern_id="llama-70b-server-queue-depth"} > (0.01)
              and
              lantern:sli_error:ratio_rate3d{lantern_id="llama-70b-server-queue-depth"} > (0.01)
            )
          labels:
            lantern_id: llama-70b-server-queue-depth
            lantern_service: llama-70b-server
            lantern_slo: queue-depth
            severity: warning
            team: ml-platform
          annotations:
            summary: llama-70b-server is burning its queue-depth error budget too fast
            description: "SLO \"queue-depth\" (objective 99% over 7d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 2h/1d at 3x, 6h/3d at 1x."
            runbook_url: https://runbooks.internal/slo/llama-70b-server-queue-depth
