apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: shop
  labels:
    lantern.dev/managed: "true"
    lantern.dev/service: checkout-api
    lantern.dev/team: payments
spec:
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: lantern-default
