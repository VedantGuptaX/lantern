apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pricing-svc
  namespace: shop
  labels:
    lantern.dev/managed: "true"
    lantern.dev/service: pricing-svc
    lantern.dev/team: pricing
spec:
  selector:
    matchLabels:
      app: pricing-svc
      tier: backend
  namespaceSelector:
    matchNames:
      - shop
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      metricRelabelings:
        - action: labeldrop
          regex: email|request_id|session_id|user_id
  sampleLimit: 25000
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pricing-svc-slo
  namespace: shop
  labels:
    lantern.dev/managed: "true"
    lantern.dev/service: pricing-svc
    lantern.dev/team: pricing
spec:
  groups:
    - name: lantern-sli-recordings-pricing-svc-availability
      rules:
        - record: lantern:sli_error:ratio_rate5m
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[5m]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[5m]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 5m
            team: pricing
        - record: lantern:sli_error:ratio_rate30m
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[30m]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[30m]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 30m
            team: pricing
        - record: lantern:sli_error:ratio_rate1h
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[1h]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[1h]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 1h
            team: pricing
        - record: lantern:sli_error:ratio_rate2h
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[2h]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[2h]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 2h
            team: pricing
        - record: lantern:sli_error:ratio_rate6h
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[6h]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[6h]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 6h
            team: pricing
        - record: lantern:sli_error:ratio_rate1d
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[1d]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[1d]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 1d
            team: pricing
        - record: lantern:sli_error:ratio_rate3d
          expr: |-
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production", rpc_grpc_status_code!="0"}[3d]))
            /
            sum(rate(rpc_server_duration_seconds_count{service_name="pricing-svc", deployment_environment="production"}[3d]))
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            lantern_window: 3d
            team: pricing
    - name: lantern-slo-meta-recordings-pricing-svc-availability
      rules:
        - record: lantern:objective:ratio
          expr: "0.995"
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            team: pricing
        - record: lantern:error_budget:ratio
          expr: "0.005"
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            team: pricing
        - record: lantern:time_period:days
          expr: "30"
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            team: pricing
        - record: lantern:current_burn_rate:ratio
          expr: |-
            lantern:sli_error:ratio_rate5m{lantern_id="pricing-svc-availability"}
            / on(lantern_id) group_left
            lantern:error_budget:ratio{lantern_id="pricing-svc-availability"}
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            team: pricing
        - record: lantern:period_error_budget_remaining:ratio
          expr: |-
            1 - (
              lantern:sli_error:ratio_rate3d{lantern_id="pricing-svc-availability"}
              / on(lantern_id) group_left
              lantern:error_budget:ratio{lantern_id="pricing-svc-availability"}
            )
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            team: pricing
    - name: lantern-slo-alerts-pricing-svc-availability
      rules:
        - alert: PricingSvcAvailabilitySLOBurnCritical
          expr: |-
            (
              lantern:sli_error:ratio_rate5m{lantern_id="pricing-svc-availability"} > (0.072)
              and
              lantern:sli_error:ratio_rate1h{lantern_id="pricing-svc-availability"} > (0.072)
            )
            or
            (
              lantern:sli_error:ratio_rate30m{lantern_id="pricing-svc-availability"} > (0.03)
              and
              lantern:sli_error:ratio_rate6h{lantern_id="pricing-svc-availability"} > (0.03)
            )
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            severity: critical
            team: pricing
          annotations:
            summary: pricing-svc is burning its availability error budget too fast
            description: "SLO \"availability\" (objective 99.5% over 30d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 5m/1h at 14.4x, 30m/6h at 6x."
            runbook_url: https://runbooks.internal/slo/pricing-svc-availability
        - alert: PricingSvcAvailabilitySLOBurnWarning
          expr: |-
            (
              lantern:sli_error:ratio_rate2h{lantern_id="pricing-svc-availability"} > (0.015)
              and
              lantern:sli_error:ratio_rate1d{lantern_id="pricing-svc-availability"} > (0.015)
            )
            or
            (
              lantern:sli_error:ratio_rate6h{lantern_id="pricing-svc-availability"} > (0.005)
              and
              lantern:sli_error:ratio_rate3d{lantern_id="pricing-svc-availability"} > (0.005)
            )
          labels:
            lantern_id: pricing-svc-availability
            lantern_service: pricing-svc
            lantern_slo: availability
            severity: warning
            team: pricing
          annotations:
            summary: pricing-svc is burning its availability error budget too fast
            description: "SLO \"availability\" (objective 99.5% over 30d) is consuming error budget at a rate that exhausts it before the window ends. Burn-rate windows: 2h/1d at 3x, 6h/3d at 1x."
            runbook_url: https://runbooks.internal/slo/pricing-svc-availability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lantern-dashboard-pricing-svc
  namespace: shop
  labels:
    grafana_dashboard: "1"
    lantern.dev/managed: "true"
    lantern.dev/service: pricing-svc
    lantern.dev/team: pricing
data:
  pricing-svc.json: |-
    {
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom-main"
          },
          "description": "Recorded by the same rules that drive burn-rate alerts (lantern:sli_error:ratio_rate*, lantern:current_burn_rate:ratio) — this panel and the alert can never disagree.",
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom-main"
              },
              "expr": "{__name__=~\"lantern:sli_error:ratio_rate.+\", lantern_id=\"pricing-svc-availability\"}",
              "legendFormat": "{{lantern_window}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom-main"
              },
              "expr": "lantern:current_burn_rate:ratio{lantern_id=\"pricing-svc-availability\"}",
              "legendFormat": "current burn rate",
              "refId": "B"
            }
          ],
          "title": "availability: SLI error ratio by window",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom-main"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom-main"
              },
              "expr": "lantern:period_error_budget_remaining:ratio{lantern_id=\"pricing-svc-availability\"}",
              "refId": "A"
            }
          ],
          "title": "availability: error budget remaining",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki-main"
          },
          "description": "Requires Lantern's log-collection DaemonSet (logsCollector.enabled) to actually ship pod logs into Loki — see docs/getting-signals-into-grafana.md. Filtered by namespace=\"shop\", deployment=\"pricing-svc\".",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki-main"
              },
              "expr": "{namespace=\"shop\", deployment=\"pricing-svc\"}",
              "refId": "A"
            }
          ],
          "title": "Logs",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "tempo",
            "uid": "tempo-main"
          },
          "description": "Requires a live trace source pushing to the collector — an SDK agent, or a separately-installed eBPF probe (OBI/Beyla) for mode: ebpf. Lantern does not deploy the eBPF probe itself; see docs/getting-signals-into-grafana.md. The service name in this query assumes it matches the resolved resource.service.name; adjust if your instrumentation names it differently.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 4,
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo-main"
              },
              "query": "{resource.service.name=\"pricing-svc\"}",
              "queryType": "traceql",
              "refId": "A"
            }
          ],
          "title": "Traces",
          "type": "traces"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "lantern",
        "team:pricing"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Lantern: pricing-svc",
      "uid": "lantern-pricing-svc",
      "version": 1
    }
