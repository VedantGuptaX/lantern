data:
  cluster-uptime.json: "{\n  \"title\": \"aks-eats-uat: Cluster & Service Uptime\",\n  \"uid\": \"eats-uat-uptime\"\
    ,\n  \"tags\": [\n    \"lantern\",\n    \"uptime\"\n  ],\n  \"timezone\": \"browser\",\n  \"refresh\"\
    : \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n\
    \    {\n      \"id\": 1,\n      \"type\": \"row\",\n      \"title\": \"At a glance\",\n      \"gridPos\"\
