    datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n  \
    \    \"targets\": [\n        {\n          \"expr\": \"sum(up{job=\\\"node-exporter\\\"})\",\n    \
    \      \"legendFormat\": \"up\",\n          \"refId\": \"A\"\n        },\n        {\n          \"\
    expr\": \"count(up{job=\\\"node-exporter\\\"})\",\n          \"legendFormat\": \"total\",\n      \
    \    \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n  \
    \        \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n      \
    \        {\n                \"color\": \"red\",\n                \"value\": null\n              },\n\
    \              {\n                \"color\": \"green\",\n                \"value\": 2\n          \
    \    }\n            ]\n          },\n          \"mappings\": [],\n          \"unit\": \"short\"\n\
    \        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\"\
