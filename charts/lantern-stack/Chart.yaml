apiVersion: v2
name: lantern-stack
description: |
  The backends Lantern compiles against. Bring-your-own by default; set
  quickstart values to install a complete stack on an empty cluster.
type: application
version: 0.1.0
appVersion: "0.1.0-p0"
keywords:
  - observability
  - opentelemetry
  - prometheus
  - slo

# Every dependency is OFF by default. `values.yaml` assumes you already run
# these and only need Lantern to point at them; `values-quickstart.yaml` turns
# them all on for an empty cluster.
#
# Versions below were checked against the upstream release pages in August 2026
# but have NOT been resolved by a real `helm dependency update`. Run that, then
# `helm lint` and `helm template`, before trusting them.
dependencies:
  # Provides the Instrumentation and OpenTelemetryCollector CRDs that
  # `lantern synth` emits into. Without this, applying Lantern output fails
  # with `no matches for kind "Instrumentation"`.
  - name: opentelemetry-operator
    version: "0.115.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-operator.enabled

  # Provides the ServiceMonitor and PrometheusRule CRDs, plus Prometheus,
  # Alertmanager, Grafana, node-exporter and kube-state-metrics. The last two
  # are what supply cluster and node system metrics — Lantern generates no
  # infrastructure scrape config of its own.
  - name: kube-prometheus-stack
    version: "86.2.3"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  # NOTE: Grafana's Loki and Tempo charts moved out of grafana/helm-charts to
  # the community repository on 30 January 2026. The old repository URL still
  # resolves for archived versions but receives no new releases, so both
  # dependencies below point at the new location.
  #
  # The version jump is not cosmetic: Loki went from 6.55.0 to the 17/18 series,
  # spanning twelve majors of breaking changes. CORRECTION (found by running
  # this for real against a live cluster): the 17/18 series still defaults
  # `deploymentMode` to SimpleScalable, not "Monolithic" — that mode name
  # doesn't exist in this chart at all (the three real options are
  # SingleBinary, SimpleScalable, Distributed). SimpleScalable REQUIRES object
  # storage, which this chart's `values-quickstart.yaml` does not configure,
  # so an unmodified install fails outright. `values-quickstart.yaml` now
  # pins `deploymentMode: SingleBinary` explicitly (plus `singleBinary.
  # replicas: 1`, since that also defaults to 0) — see the comment there.
  #
  # SECOND CORRECTION (found by actually running `helm template` against a
  # real cluster, after the fix above looked complete): pinning
  # `deploymentMode` alone does not zero out the SimpleScalable target's own
  # replica counts — `write`/`read`/`backend` default to 3 each regardless of
  # `deploymentMode`, and the chart's own `templates/validate.yaml` fails the
  # render if `singleBinary.replicas` and any of those are both > 0.
  # `values-quickstart.yaml` now zeroes all three explicitly too. Confirmed
  # against the chart's real `templates/validate.yaml` logic, not just the
  # error message.
  #
  # Enterprise support was removed and the built-in MinIO is deprecated in
  # this series.
  - name: tempo
    version: "2.2.1"
    repository: https://grafana-community.github.io/helm-charts
    condition: tempo.enabled

  - name: loki
    version: "18.7.6"
    repository: https://grafana-community.github.io/helm-charts
    condition: loki.enabled

  # Optional: installs dcgm-exporter itself, for the case where GPU nodes
  # already run real GPU workloads (driver + device plugin proven working --
  # something already scheduled against the nvidia.com/gpu extended
  # resource) but nobody has put dcgm-exporter on them yet. Gated by
  # gpuMonitoring.installExporter, which is deliberately a SEPARATE toggle
  # from dcgm-exporter.enabled below -- see values.yaml for why both exist.
  # Deliberately NOT the full NVIDIA GPU Operator: that chart also manages
  # the driver (nvidia-driver-daemonset) and container toolkit, which is
  # node-level infrastructure this project has no business touching. Confirmed
  # real via `helm pull gpu-helm-charts/dcgm-exporter --version 4.8.3` against
  # the actual repository below on 2026-08-18; not yet exercised with
  # `helm dependency update && helm template` against a live cluster.
  - name: dcgm-exporter
    version: "4.8.3"
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgm-exporter.enabled
