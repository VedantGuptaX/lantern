# QUICKSTART: a complete observability stack on an empty cluster.
#
#   helm dependency update charts/lantern-stack
#   helm install lantern charts/lantern-stack \
#     -n observability --create-namespace \
#     -f charts/lantern-stack/values-quickstart.yaml
#
# This installs real backends into your cluster. It exists so the project is
# demonstrable in five minutes, and so P1 dashboard work has somewhere to run.
# It is NOT a production deployment: storage is ephemeral, retention is short,
# and there is no HA. A team running this for real should size the subcharts
# themselves, or keep the default bring-your-own posture.

namespace: observability

preflight:
  hook:
    enabled: true

# Datasource UIDs matching what's actually provisioned below: kube-
# prometheus-stack's own Grafana datasource defaults to uid "prometheus"
# (checked against its chart source); loki-main/tempo-main match the
# additionalDataSources block under kube-prometheus-stack.grafana further
# down. Setting these is what turns on the per-service dashboards this chart
# now generates (backends.dashboards.type: grafana, already the default) —
# without them, dashboards render with the SLO/logs/traces panels skipped.
backends:
  metrics:
    datasource: prometheus
  traces:
    datasource: tempo-main
  logs:
    datasource: loki-main

instrumentation:
  provider: otel-operator
  ebpf:
    # Still off. eBPF needs privileged containers and node access; that should
    # be a deliberate decision even in a demo. Turning this on here does NOT
    # deploy an eBPF probe — Lantern doesn't ship one. See
    # docs/getting-signals-into-grafana.md before enabling it.
    enabled: false

collector:
  enabled: true
  replicas: 1

# Ships pod logs into Loki. See templates/logs-collector.yaml and
# docs/getting-signals-into-grafana.md — without this, Loki is an empty
# store with a Grafana datasource pointed at nothing.
logsCollector:
  enabled: true

policy:
  requireTeamLabel: false

defaults:
  environment: dev
  slo:
    availability: 99.9
    latency:
      objective: 99.0
      threshold: 500ms

# ---------------------------------------------------------------------------
# Everything on.
# ---------------------------------------------------------------------------

opentelemetry-operator:
  enabled: true
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-contrib

kube-prometheus-stack:
  enabled: true
  # node-exporter and kube-state-metrics are what produce cluster and node
  # system metrics. Lantern generates no infrastructure scrape config itself,
  # so these are the source of the "system metrics" half of the stack.
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true
  prometheus:
    prometheusSpec:
      retention: 24h
      # Pick up ServiceMonitors and PrometheusRules from every namespace,
      # regardless of Helm release labels. Without this, Prometheus ignores
      # everything `lantern synth` emits.
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      enableRemoteWriteReceiver: true
  grafana:
    enabled: true
    adminPassword: lantern
    # Labelled so P1's GrafanaDashboard resources can select this instance.
    labels:
      dashboards: main
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
    additionalDataSources:
      - name: Tempo
        type: tempo
        uid: tempo-main
        url: http://lantern-tempo.observability:3100
        access: proxy
      - name: Loki
        type: loki
        uid: loki-main
        url: http://lantern-loki.observability:3100
        access: proxy

tempo:
  enabled: true
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

loki:
  enabled: true
  # The chart's own default is `deploymentMode: SimpleScalable`, which reads
  # and writes as three separate targets (read/write/backend) and REQUIRES
  # object storage (S3/GCS/etc.) — it will not come up on `storage.type:
  # filesystem` below. A five-minute demo has no object store, so this is
  # pinned to SingleBinary explicitly: one process, filesystem storage,
  # correct for a small/no-HA install. Do not remove this without also
  # switching to real object storage. This is the least-verified block in the
  # chart — see the note in Chart.yaml. If the install still fails, disable
  # loki (`--set loki.enabled=false`) and continue: metrics, traces,
  # instrumentation and alerts do not depend on it.
  deploymentMode: SingleBinary
  singleBinary:
    # The chart's own default is 0 replicas even in SingleBinary mode — it
    # deploys nothing until this is set explicitly.
    replicas: 1
  # `deploymentMode` alone does not zero out the SimpleScalable target's own
  # replica counts — write/read/backend default to 3 each *regardless* of
  # deploymentMode (confirmed against the chart's own values.yaml and its
  # templates/validate.yaml, which fails the render if singleBinary.replicas
  # and any of these are both > 0: "more than zero replicas configured for
  # both the single binary and simple scalable targets"). Found by actually
  # running `helm template` against a real cluster — setting deploymentMode
  # without this looks correct but still fails at render time.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    # 18.x requires an explicit schema config; TSDB with v13 is the current
    # recommended pairing.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
