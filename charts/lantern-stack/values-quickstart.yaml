# QUICKSTART: a complete observability stack on an empty cluster.
#
#   helm dependency update charts/lantern-stack
#   helm install lantern charts/lantern-stack \
#     -n observability --create-namespace \
#     -f charts/lantern-stack/values-quickstart.yaml
#
# This installs real backends into your cluster. It exists so the project is
# demonstrable in five minutes, and so P1 dashboard work has somewhere to run.
# It is NOT a production deployment: storage is ephemeral, retention is short,
# and there is no HA. A team running this for real should size the subcharts
# themselves, or keep the default bring-your-own posture.

namespace: observability

preflight:
  hook:
    enabled: true

# Datasource UIDs matching what's actually provisioned below: kube-
# prometheus-stack's own Grafana datasource defaults to uid "prometheus"
# (checked against its chart source); loki-main/tempo-main match the
# additionalDataSources block under kube-prometheus-stack.grafana further
# down. Setting these is what turns on the per-service dashboards this chart
# now generates (backends.dashboards.type: grafana, already the default) —
# without them, dashboards render with the SLO/logs/traces panels skipped.
backends:
  metrics:
    datasource: prometheus
  traces:
    datasource: tempo-main
  logs:
    datasource: loki-main

instrumentation:
  provider: otel-operator
  ebpf:
    # Still off. eBPF needs privileged containers and node access; that should
    # be a deliberate decision even in a demo. Turning this on here does NOT
    # deploy an eBPF probe — Lantern doesn't ship one. See
    # docs/getting-signals-into-grafana.md before enabling it.
    enabled: false

collector:
  enabled: true
  replicas: 1
  # The chart's own default (100m) reserves far more than this actually
  # uses in practice -- measured on a real cluster via `kubectl top pod`:
  # ~29m steady-state. On a tight cluster (see README's "Resource
  # requirements" table), that gap between requested and actually-used CPU
  # is real scheduling headroom sitting idle -- found the hard way when a
  # single agent-injected pod's 50m init-container request couldn't
  # schedule anywhere despite the cluster having real spare CPU capacity,
  # just not reserved as such. Lowered to 40m: still real margin above the
  # ~29m measured, but frees 60m of request for things that actually need
  # to schedule.
  resources:
    requests:
      cpu: 40m
      memory: 256Mi
    limits:
      memory: 512Mi

# Ships pod logs into Loki. See templates/logs-collector.yaml and
# docs/getting-signals-into-grafana.md — without this, Loki is an empty
# store with a Grafana datasource pointed at nothing.
logsCollector:
  enabled: true

policy:
  requireTeamLabel: false

defaults:
  environment: dev
  slo:
    availability: 99.9
    latency:
      objective: 99.0
      threshold: 500ms

# ---------------------------------------------------------------------------
# Everything on.
# ---------------------------------------------------------------------------

opentelemetry-operator:
  enabled: true
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-contrib

kube-prometheus-stack:
  enabled: true
  # node-exporter and kube-state-metrics are what produce cluster and node
  # system metrics. Lantern generates no infrastructure scrape config itself,
  # so these are the source of the "system metrics" half of the stack.
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true
  prometheus:
    prometheusSpec:
      retention: 24h
      # Pick up ServiceMonitors and PrometheusRules from every namespace,
      # regardless of Helm release labels. Without this, Prometheus ignores
      # everything `lantern synth` emits.
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      enableRemoteWriteReceiver: true
  grafana:
    enabled: true
    adminPassword: lantern
    # Labelled so P1's GrafanaDashboard resources can select this instance.
    labels:
      dashboards: main
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
    additionalDataSources:
      - name: Tempo
        type: tempo
        uid: tempo-main
        # Was :3100 -- Loki's port, not Tempo's. Copy-paste bug from the
        # Loki entry right below this one: Tempo's actual HTTP query-
        # frontend port is 3200 (server.http_listen_port in the tempo
        # subchart's own config). Found because Grafana's datasource proxy
        # returned a flat 502 for every Tempo query -- nothing else in the
        # chain was broken, this URL just pointed nowhere real.
        url: http://lantern-tempo.observability:3200
        access: proxy
      - name: Loki
        type: loki
        uid: loki-main
        url: http://lantern-loki.observability:3100
        access: proxy

tempo:
  enabled: true
  # The tempo.tempo.receivers override below (otlp only) looks like it
  # should be enough, but Helm values merging can't delete a key -- the
  # subchart's own default receivers map still has `opencensus:` (present,
  # null/default config), and a values override can only add/overwrite
  # keys, never remove one. Tempo v2.9.3 (the image this chart pins)
  # dropped the OpenCensus receiver years ago (deprecated, folded into
  # OpenTelemetry), so it refuses to start at all: "'receivers' unknown
  # type: \"opencensus\"" -- found on a real cluster, every single time,
  # not a hypothetical. The only reliable fix is overriding the whole
  # templated `config` string with receivers hardcoded to exclude it;
  # everything else below is copied verbatim from the tempo subchart's own
  # default `config` (same tpl-evaluated .Values references), so it still
  # responds correctly to every other tempo.tempo.* value.
  config: |
    stream_over_http_enabled: {{ .Values.tempo.streamOverHttpEnabled }}
    memberlist:
      cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
    multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
    usage_report:
      reporting_enabled: {{ .Values.tempo.reportingEnabled }}
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    distributor:
      receivers:
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_binary:
              endpoint: 0.0.0.0:6832
            thrift_compact:
              endpoint: 0.0.0.0:6831
            thrift_http:
              endpoint: 0.0.0.0:14268
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    ingester:
      {{- toYaml .Values.tempo.ingester | nindent 6 }}
    server:
      {{- toYaml .Values.tempo.server | nindent 6 }}
    storage:
      {{- toYaml .Values.tempo.storage | nindent 6 }}
    querier:
      {{- toYaml .Values.tempo.querier | nindent 6 }}
    query_frontend:
      {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
    overrides:
      {{- toYaml .Values.tempo.overrides | nindent 6 }}
      {{- if .Values.tempo.metricsGenerator.enabled }}
    metrics_generator:
      {{- if .Values.tempo.metricsGenerator.processor }}
      processor:
        {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
      {{- end }}
      {{- if .Values.tempo.metricsGenerator.registry }}
      registry:
        {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
      {{- end }}
      storage:
        path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
        {{- if .Values.tempo.metricsGenerator.storage.remote_write }}
        remote_write:
          {{- toYaml .Values.tempo.metricsGenerator.storage.remote_write | nindent 10 }}
        {{- else }}
        remote_write:
          - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
        {{- end }}
      traces_storage:
        path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
      {{- end }}
  tempo:
    resources:
      requests:
        # Measured on a real cluster via `kubectl top pod`: ~4m steady-state
        # CPU, well under the 30m originally requested. Lowered to 10m
        # (still real margin above measured usage) to free CPU-request
        # headroom on a chronically tight cluster -- see the collector's
        # resources comment above for why this matters concretely, not just
        # in the abstract.
        cpu: 10m
        memory: 128Mi
      # 256Mi looked fine for the first ~12.5h on a real cluster, then
      # OOMKilled outright (exit 137) with no warning beforehand -- Tempo's
      # ingester accumulates in-memory blocks between flushes, so memory
      # grows with sustained trace volume/query load rather than staying
      # flat, and 256Mi just wasn't enough headroom for that. Raised to
      # 512Mi -- which then OOMKilled again after only ~19 minutes once
      # real SDK instrumentation expanded from 1 service to all 8: trace
      # ingestion volume scales with instrumented-service count, and 512Mi
      # was sized for the single-canary load, not the fleet. Every crash
      # loses whatever spans were mid-assembly, which is what "traces
      # missing from dashboards" actually was -- not a query/dashboard bug,
      # a resource-limit-vs-real-load mismatch. Raised to 1536Mi; this
      # cluster has real memory slack (~1.9-2.8Gi free per node when this
      # was measured, unlike CPU, see README's "Resource requirements"
      # table), so this is real headroom, not a guess.
      limits:
        memory: 1536Mi
  # The chart's own default is persistence.enabled: false -- trace data
  # lives on whatever ephemeral storage the pod's writable layer gives it
  # and is gone on every restart/reschedule. Fine for a five-minute demo,
  # not for anything you'd actually want to query after an incident. Loki
  # (below) already defaults to a real PVC via its own subchart; this makes
  # Tempo match it explicitly rather than leaving trace retention silently
  # weaker than log retention. Verified on a real cluster: a 10Gi Azure Disk
  # PVC (`disk.csi.azure.com`, default StorageClass) binds cleanly and
  # survives a pod restart with trace data intact.
  persistence:
    enabled: true
    size: 10Gi

loki:
  enabled: true
  # The chart's own default is `deploymentMode: SimpleScalable`, which reads
  # and writes as three separate targets (read/write/backend) and REQUIRES
  # object storage (S3/GCS/etc.) — it will not come up on `storage.type:
  # filesystem` below. A five-minute demo has no object store, so this is
  # pinned to SingleBinary explicitly: one process, filesystem storage,
  # correct for a small/no-HA install. Do not remove this without also
  # switching to real object storage. This is the least-verified block in the
  # chart — see the note in Chart.yaml. If the install still fails, disable
  # loki (`--set loki.enabled=false`) and continue: metrics, traces,
  # instrumentation and alerts do not depend on it.
  deploymentMode: SingleBinary
  singleBinary:
    # The chart's own default is 0 replicas even in SingleBinary mode — it
    # deploys nothing until this is set explicitly.
    replicas: 1
  # `deploymentMode` alone does not zero out the SimpleScalable target's own
  # replica counts — write/read/backend default to 3 each *regardless* of
  # deploymentMode (confirmed against the chart's own values.yaml and its
  # templates/validate.yaml, which fails the render if singleBinary.replicas
  # and any of these are both > 0: "more than zero replicas configured for
  # both the single binary and simple scalable targets"). Found by actually
  # running `helm template` against a real cluster — setting deploymentMode
  # without this looks correct but still fails at render time.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  # The chart's own defaults for these are both `enabled: true` -- optional
  # memcached-based caches for query results and chunk lookups. Found live on
  # a real cluster: each one requests 500m CPU / 9830Mi memory, sized for a
  # production Loki install, not this demo-scale single-binary target. On a
  # tight cluster (see README's "Resource requirements" table) they never
  # schedule -- `FailedScheduling: Insufficient cpu, Insufficient memory` --
  # and just sit there as permanently Pending StatefulSets. Loki works
  # correctly without them, just without result caching for repeat identical
  # queries. Disabled here rather than left as silent scheduling noise;
  # re-enable explicitly if you have the headroom and want the caching.
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    # 18.x requires an explicit schema config; TSDB with v13 is the current
    # recommended pairing.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
