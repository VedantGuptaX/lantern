{{/*
Defense-in-depth for people who run `helm install` directly instead of
`make preflight && make install-quickstart`.

HONEST SCOPE: Helm's docs confirm the crds/ directory is installed as part of
`helm install` itself and is not templated or hook-gated, but do not fully
specify its ordering relative to pre-install hooks. This hook should NOT be
treated as a guarantee that it runs before any CRD from this release's
subcharts is touched. What it verifiably DOES do: run before the Deployments,
DaemonSets and webhook configurations in this chart are created, which is
where the actual blast radius lives (a second Grafana, a second Prometheus, a
colliding webhook). The authoritative, complete check is
`scripts/preflight-check.sh` — run it first, always. This hook exists for the
case where someone doesn't.

Only runs when a CRD-owning subchart is actually enabled — there is nothing to
conflict-check for a pure bring-your-own install.

BUG FOUND ON A REAL FIRST-EVER INSTALL, FIXED HERE: this hook runs AFTER
Helm's own crds/ step has already created this release's CRDs (that ordering
is exactly why the hook exists at all — see above), but crds/ objects are, by
Helm's own design, NEVER stamped with a meta.helm.sh/release-* ownership
annotation — that is precisely what lets `helm uninstall` leave CRDs (and any
data under them) alone. That means "no ownership annotation" is NOT reliable
evidence of a foreign install: it is exactly what THIS release's own CRDs
look like seconds after their own first-ever install too, on every fresh
cluster, every time — this hook would have blocked its own genuinely clean,
correct install unconditionally. The only signal that actually distinguishes
"nothing to lose" from "something real might get clobbered" is whether any
custom resource already exists under the CRD — an empty CRD has nothing to
conflict with regardless of who technically owns the definition. The check
below verifies that instead of trusting the ownership annotation alone.
*/}}
{{- if and .Values.preflight.hook.enabled (or (index .Values "kube-prometheus-stack" "enabled") (index .Values "opentelemetry-operator" "enabled")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-preflight
  namespace: {{ include "lantern.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Read-only, scoped to exactly the two API groups this chart's CRD-owning
  # subcharts (kube-prometheus-stack, opentelemetry-operator) ship — needed
  # to count existing custom resource instances, since CRD ownership
  # annotations alone can't tell an empty CRD apart from one already in real
  # use (see the check.sh comment below).
  - apiGroups: ["monitoring.coreos.com", "opentelemetry.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-preflight
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-preflight
    namespace: {{ include "lantern.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preflight
  namespace: {{ include "lantern.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  check.sh: |
    #!/bin/sh
    set -eu
    RELEASE="{{ .Release.Name }}"
    NAMESPACE="{{ include "lantern.namespace" . }}"
    BLOCKED=0

    for crd in \
      alertmanagers.monitoring.coreos.com prometheuses.monitoring.coreos.com \
      prometheusrules.monitoring.coreos.com servicemonitors.monitoring.coreos.com \
      podmonitors.monitoring.coreos.com probes.monitoring.coreos.com \
      thanosrulers.monitoring.coreos.com \
      instrumentations.opentelemetry.io opentelemetrycollectors.opentelemetry.io \
    ; do
      if ! kubectl get crd "$crd" >/dev/null 2>&1; then
        continue
      fi
      OWNER_NAME=$(kubectl get crd "$crd" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
      OWNER_NS=$(kubectl get crd "$crd" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-namespace}' 2>/dev/null || true)

      if [ "$OWNER_NAME" = "$RELEASE" ] && [ "$OWNER_NS" = "$NAMESPACE" ]; then
        echo "ok:    $crd already owned by this release (upgrade)"
        continue
      fi

      # No matching ownership annotation. That alone does not mean "foreign":
      # Helm's crds/ mechanism never annotates CRDs, ever, including this
      # release's own — so this branch is also exactly what a genuinely clean
      # first-ever install of THIS chart looks like. Count actual custom
      # resource instances instead: an empty CRD has nothing to conflict
      # with no matter who "owns" the definition.
      RESOURCE="${crd%%.*}"
      GROUP="${crd#*.}"
      LIST_OUTPUT=$(kubectl get "$RESOURCE.$GROUP" --all-namespaces -o name 2>&1)
      KUBECTL_EXIT=$?
      if [ "$KUBECTL_EXIT" -ne 0 ]; then
        INSTANCE_COUNT=-1
      elif [ -z "$LIST_OUTPUT" ]; then
        INSTANCE_COUNT=0
      else
        INSTANCE_COUNT=$(printf '%s\n' "$LIST_OUTPUT" | wc -l | tr -d ' ')
      fi

      if [ "$INSTANCE_COUNT" -eq 0 ] 2>/dev/null; then
        echo "ok:    $crd exists with no Helm ownership annotation, but has zero custom"
        echo "       resources under it anywhere on the cluster — nothing to conflict"
        echo "       with, proceeding. (This is what this release's own crds/-installed"
        echo "       CRDs look like too — Helm never annotates those.)"
        continue
      fi

      if [ "$INSTANCE_COUNT" -lt 0 ] 2>/dev/null; then
        echo "BLOCK: $crd exists and its custom resource instances could not be listed"
        echo "       (RBAC or API error) — cannot confirm it's safe. Run"
        echo "       scripts/preflight-check.sh from a machine with kubectl access for"
        echo "       the full report, or set preflight.hook.enabled=false to proceed"
        echo "       anyway if this is expected."
        BLOCKED=1
      elif [ -z "$OWNER_NAME" ]; then
        echo "BLOCK: $crd exists, is not Helm-managed, and already has $INSTANCE_COUNT"
        echo "       custom resource(s) under it — this is a real, in-use install, not"
        echo "       just-created residue. Run scripts/preflight-check.sh from a machine"
        echo "       with kubectl access for the full report, or set"
        echo "       preflight.hook.enabled=false to proceed anyway if this is expected."
        BLOCKED=1
      else
        echo "BLOCK: $crd exists, owned by Helm release '$OWNER_NAME/$OWNER_NS' — not this"
        echo "       one — and already has $INSTANCE_COUNT custom resource(s) under it."
        echo "       Disable the owning subchart and point stack.yaml at the existing install."
        echo "       See docs/adopting-an-existing-cluster.md. Or set preflight.hook.enabled=false"
        echo "       to proceed anyway if this is expected."
        BLOCKED=1
      fi
    done

    if [ "$BLOCKED" -eq 1 ]; then
      echo ""
      echo "Preflight found a CRD conflict. Aborting before any workload is created."
      exit 1
    fi
    echo "Preflight: no CRD ownership conflicts found."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-preflight
  namespace: {{ include "lantern.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-preflight
      restartPolicy: Never
      containers:
        - name: preflight
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "/scripts/check.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-preflight
            defaultMode: 0755
{{- end }}
