{{- if .Values.collector.enabled }}
{{/*
The collector every injected agent exports to.

Nothing in P0 deployed this, which meant `lantern synth` produced correct
Instrumentation CRs pointing at an OTLP endpoint that did not exist. Telemetry
was configured but never actually flowed. This closes that gap.

It is an OpenTelemetryCollector custom resource, so it requires the
OpenTelemetry Operator. Enable the subchart, or install the operator yourself
before enabling this. See lantern.otelCollectorCRDReady in _helpers.tpl for
why this is also gated on the CRD actually being registered yet.
*/}}
{{/*
RBAC for the k8sattributes processor below.

BUG THIS FIXES, found on a real cluster: this collector's config uses the
k8sattributes processor (it's in all three pipelines) but the chart never
created a ServiceAccount or any cluster RBAC for it -- only the
logs-collector got that treatment. The OTel Operator then defaulted the
collector to a ServiceAccount with no pod read access, and the processor
failed continuously:

  "Failed to watch *v1.Pod: pods is forbidden: User
   system:serviceaccount:observability:lantern-collector-collector cannot
   list resource pods at the cluster scope"

The collector stays Running and telemetry still flows, so nothing looks
broken -- but every span and metric passing through loses its
k8s.namespace.name / k8s.pod.name / k8s.deployment.name enrichment, which
is exactly what dashboards and queries filter on. Rules match the
logs-collector's, which follow the k8sattributesprocessor README's
documented minimum.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-collector
  namespace: {{ include "lantern.namespace" . }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-collector
    namespace: {{ include "lantern.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-collector
  apiGroup: rbac.authorization.k8s.io
{{/*
Only the custom resource is gated on the CRD existing yet -- the RBAC above
is created unconditionally, matching logs-collector.yaml. On a genuinely
fresh install the CRD isn't registered when this first renders, and the
follow-up `helm upgrade` creates the CR against RBAC that's already in
place.
*/}}
{{- if (include "lantern.otelCollectorCRDReady" .) }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Release.Name }}-collector
  namespace: {{ include "lantern.namespace" . }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
spec:
  mode: deployment
  replicas: {{ .Values.collector.replicas }}
  image: {{ .Values.collector.image }}
  serviceAccount: {{ .Release.Name }}-collector
  resources:
    {{- toYaml .Values.collector.resources | nindent 4 }}
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Bound memory before the collector is OOMKilled under a traffic spike.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      batch:
        timeout: 5s
        send_batch_size: 8192

      # Attach Kubernetes metadata so telemetry carries pod, namespace and
      # workload identity without every service configuring it by hand.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name

      # Cardinality mitigation, not enforcement of policy.maxRouteCardinality:
      # this collapse is fixed and unconditional -- it does not read that
      # value and applies the same regex regardless of what it's set to.
      # High-cardinality identifiers in http.route are the single most common
      # way a well-meaning team melts a Prometheus instance; this catches the
      # common numeric-ID/UUID case but is not a hard cap at N distinct
      # values (see api/v1alpha1/types.go's MaxRouteCardinality comment).
      transform/route_cardinality:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              # Collapse numeric path segments, which are almost always IDs.
              - replace_pattern(attributes["http.route"], "/[0-9]+", "/{id}")
              - replace_pattern(attributes["http.route"], "/[0-9a-fA-F-]{36}", "/{uuid}")

      # Drop attributes the stack policy forbids, before they ever reach
      # storage.
      attributes/deny:
        actions:
          {{- range .Values.policy.denyLabels }}
          - key: {{ . }}
            action: delete
          {{- end }}

    exporters:
      {{- with (include "lantern.tracesEndpoint" .) }}
      otlp/traces:
        endpoint: {{ . }}
        tls:
          insecure: true
      {{- end }}
      {{- with (include "lantern.metricsRemoteWrite" .) }}
      prometheusremotewrite:
        endpoint: {{ . }}
        # Emit resource attributes as labels so the SLI selectors the compiler
        # generates (service_name, deployment_environment) actually resolve.
        # Without this, every generated alert silently never fires.
        resource_to_telemetry_conversion:
          enabled: true
        tls:
          insecure: true
      {{- end }}
      {{- with (include "lantern.logsEndpoint" .) }}
      otlphttp/logs:
        logs_endpoint: {{ . }}/otlp/v1/logs
        tls:
          insecure: true
      {{- end }}
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes/deny, batch]
          exporters: [{{ if (include "lantern.tracesEndpoint" .) }}otlp/traces{{ else }}debug{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/route_cardinality, attributes/deny, batch]
          exporters: [{{ if (include "lantern.metricsRemoteWrite" .) }}prometheusremotewrite{{ else }}debug{{ end }}]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes/deny, batch]
          exporters: [{{ if (include "lantern.logsEndpoint" .) }}otlphttp/logs{{ else }}debug{{ end }}]
{{- end }}
{{- end }}
