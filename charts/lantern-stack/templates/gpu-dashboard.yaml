{{- if and .Values.gpuMonitoring.enabled .Values.gpuMonitoring.dashboard.enabled }}
{{/*
Cluster-wide GPU fleet dashboard.

templates/gpu-monitoring.yaml ships alerts (thermal, ECC, XID, power) but no
way to actually look at the fleet -- this closes that gap with a single
Grafana dashboard, the same sidecar-discovery ConfigMap shape
pkg/emit/grafana uses for per-service dashboards (label grafana_dashboard:
"1", picked up automatically by kube-prometheus-stack's bundled sidecar with
no further action). This is chart-level, static content -- unlike the
per-service dashboards, there's no ServiceObservability driving it, so it's
authored directly here rather than generated by the compiler.

Where a panel's threshold matters (temperature), it's templated from the
SAME .Values.gpuMonitoring.alerts.* value that drives the matching alert
below, for the same reason the per-service dashboards reuse the exact
recording rules that drive burn-rate alerts: the panel and the alert must
never be able to disagree about where the line is.

Grafana's own legend/templating syntax ({{Hostname}}, etc.) uses the exact
same {{ }} delimiters as Helm -- the {{`{{...}}`}} backtick-raw-string
pattern below (already used in gpu-monitoring.yaml's alert annotations)
renders that syntax as literal text instead of Helm trying to evaluate it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gpu-fleet-dashboard
  namespace: {{ include "lantern.namespace" . }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
    lantern.dev/managed: "true"
    grafana_dashboard: "1"
data:
  gpu-fleet.json: |
    {
      "uid": "lantern-gpu-fleet",
      "title": "Lantern: GPU Fleet",
      "tags": ["lantern", "gpu"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "GPU nodes", "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "count(count by (Hostname) (DCGM_FI_DEV_GPU_UTIL))" }]
        },
        {
          "id": 2, "title": "Total GPUs", "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "count(DCGM_FI_DEV_GPU_UTIL)" }]
        },
        {
          "id": 3, "title": "Fleet avg utilization", "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "avg(DCGM_FI_DEV_GPU_UTIL)" }]
        },
        {
          "id": 4, "title": "GPU utilization", "type": "timeseries",
          "description": "DCGM_FI_DEV_GPU_UTIL per GPU. No per-pod breakdown here -- that's the per-service inference dashboard instead, which needs dcgm-exporter's Kubernetes pod-mapping turned on (see docs/gpu-and-inference-observability.md).",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}" }]
        },
        {
          "id": 5, "title": "Memory-copy utilization", "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "DCGM_FI_DEV_MEM_COPY_UTIL", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}" }]
        },
        {
          "id": 6, "title": "Temperature", "type": "timeseries",
          "description": "Red threshold line is gpuMonitoring.alerts.thermalCriticalC ({{ .Values.gpuMonitoring.alerts.thermalCriticalC }}C) -- the exact same value LanternGPUThermalThrottleImminent alerts on, so this line and that alert can never disagree.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": {{ .Values.gpuMonitoring.alerts.thermalCriticalC }} }
                ]
              }
            }
          },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "DCGM_FI_DEV_GPU_TEMP", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}" }]
        },
        {
          "id": 7, "title": "Power draw vs. cap", "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "fieldConfig": { "defaults": { "unit": "watt" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "DCGM_FI_DEV_POWER_USAGE", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}} draw" },
            { "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "B", "expr": "DCGM_FI_DEV_POWER_MGMT_LIMIT", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}} cap" }
          ]
        },
        {
          "id": 8, "title": "Uncorrectable ECC errors (24h)", "type": "table",
          "description": "24h window for visibility, not the 15m window LanternGPUUncorrectableECCError alerts on -- a page fires faster than this panel updates its story. Any nonzero row here is a GPU to stop trusting results from until checked with nvidia-smi -q -d ECC.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[24h]) > 0", "format": "table", "instant": true }]
        },
        {
          "id": 9, "title": "XID errors (24h)", "type": "table",
          "description": "24h window for visibility, not the 15m window LanternGPUXIDError alerts on. Cross-reference the XID code against NVIDIA's XID error table -- some (e.g. 79, GPU fallen off the bus) mean the GPU needs a node reboot, not just a workload drain.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "{{ .Values.gpuMonitoring.dashboard.datasourceUID }}" }, "refId": "A", "expr": "increase(DCGM_FI_DEV_XID_ERRORS[24h]) > 0", "format": "table", "instant": true }]
        }
      ]
    }
{{- end }}
