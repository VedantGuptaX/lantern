{{/*
The ObservabilityStack is rendered into a ConfigMap rather than applied as a
custom resource.

P0 has no operator and therefore no CRDs, so an ObservabilityStack CR would be
rejected by the API server. A ConfigMap works today and stays useful later:
the chart describes the backends it just installed, and `lantern synth` reads
that description back. The chart and the compiler agree because the chart is
the one telling the compiler what exists.

  kubectl get cm -n {{ include "lantern.namespace" . }} {{ .Release.Name }}-stack \
    -o jsonpath='{.data.stack\.yaml}' > stack.yaml
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-stack
  namespace: {{ include "lantern.namespace" . }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
data:
  stack.yaml: |
    apiVersion: lantern.dev/v1alpha1
    kind: ObservabilityStack
    metadata:
      name: {{ .Release.Name }}
    spec:
      backends:
        metrics:
          type: {{ .Values.backends.metrics.type }}
          operator: {{ .Values.backends.metrics.operator }}
          {{- with (include "lantern.metricsRemoteWrite" .) }}
          remoteWrite: {{ . }}
          {{- end }}
          {{- with (include "lantern.metricsQueryURL" .) }}
          queryURL: {{ . }}
          {{- end }}
          {{- with .Values.backends.metrics.datasource }}
          datasource: {{ . }}
          {{- end }}
          {{- with .Values.backends.metrics.ruleNamespace }}
          ruleNamespace: {{ . }}
          {{- end }}
        {{- /*
        Guarded on the exact same condition lantern.tracesEndpoint/
        logsEndpoint already use: a real endpoint, either bring-your-own
        (backends.traces.otlpEndpoint set directly) or quickstart (the
        subchart enabled). Without this guard, "type: tempo"/"type: loki"
        rendered unconditionally even with tempo.enabled/loki.enabled false
        and no otlpEndpoint/endpoint set -- this ConfigMap exists
        specifically so "the chart describes the backends it just
        installed" (see the doc comment above), and a backend that isn't
        installed shouldn't be described as existing. `lantern synth`
        against that stack.yaml wouldn't silently misbehave (BuildInstrumentation
        already errors loudly on a missing OTLPEndpoint), but the
        self-description was wrong regardless of whether anything downstream
        happened to catch it. Found generating a real metrics-only install
        with `lantern init` and diffing the rendered output.
        */}}
        {{- if or .Values.backends.traces.otlpEndpoint (index .Values "tempo" "enabled") }}
        traces:
          type: {{ .Values.backends.traces.type }}
          {{- with (include "lantern.tracesEndpoint" .) }}
          otlpEndpoint: {{ . }}
          {{- end }}
          {{- with .Values.backends.traces.datasource }}
          datasource: {{ . }}
          {{- end }}
        {{- end }}
        {{- if or .Values.backends.logs.endpoint (index .Values "loki" "enabled") }}
        logs:
          type: {{ .Values.backends.logs.type }}
          {{- with (include "lantern.logsEndpoint" .) }}
          endpoint: {{ . }}
          {{- end }}
          {{- with .Values.backends.logs.datasource }}
          datasource: {{ . }}
          {{- end }}
        {{- end }}
        dashboards:
          type: {{ .Values.backends.dashboards.type }}
          folderStrategy: {{ .Values.backends.dashboards.folderStrategy }}
          {{- with .Values.backends.dashboards.instanceLabels }}
          instanceLabels:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      instrumentation:
        provider: {{ .Values.instrumentation.provider }}
        namespace: {{ include "lantern.namespace" . }}
        {{- with (include "lantern.collectorEndpoint" .) }}
        collector: {{ . }}
        {{- end }}
        ebpf:
          enabled: {{ .Values.instrumentation.ebpf.enabled }}
          provider: {{ .Values.instrumentation.ebpf.provider }}
          privileged: {{ .Values.instrumentation.ebpf.privileged }}

      policy:
        {{- toYaml .Values.policy | nindent 8 }}

      defaults:
        {{- toYaml .Values.defaults | nindent 8 }}
