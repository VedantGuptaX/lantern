# Default posture: BRING YOUR OWN BACKEND.
#
# Nothing is installed. The chart renders an ObservabilityStack describing the
# backends you already run, and deploys a collector that forwards to them.
# This is what a company with an existing Prometheus and Grafana wants.
#
# For an empty cluster, use values-quickstart.yaml instead.

namespace: observability

# Read-only safety gate, on by default. See scripts/preflight-check.sh for the
# authoritative version (run before `helm install`, not just inside it) and
# templates/preflight-hook.yaml for what this in-cluster copy actually covers
# and does not.
preflight:
  hook:
    enabled: true

# ---------------------------------------------------------------------------
# Backends
#
# When the matching subchart is enabled, these are ignored and the in-cluster
# service addresses are used instead. See templates/_helpers.tpl.
# ---------------------------------------------------------------------------
backends:
  metrics:
    type: prometheus
    remoteWrite: ""      # e.g. http://mimir.observability:9009/api/v1/push
    queryURL: ""         # e.g. http://prometheus.observability:9090
    operator: prometheus-operator
    datasource: ""       # Grafana datasource uid, used by P1 dashboards
    ruleNamespace: ""    # defaults to each service's own namespace
  traces:
    type: tempo
    otlpEndpoint: ""     # e.g. tempo.observability:4317
    datasource: ""
  logs:
    type: loki
    endpoint: ""         # e.g. http://loki.observability:3100
    datasource: ""
  dashboards:
    type: grafana
    folderStrategy: per-team
    instanceRef:
      name: ""
      namespace: ""
    instanceLabels:
      dashboards: main

# ---------------------------------------------------------------------------
# Instrumentation
# ---------------------------------------------------------------------------
instrumentation:
  provider: otel-operator   # otel-operator | odigos | none
  ebpf:
    # eBPF requires privileged access. It is opt-in, never a default, because
    # a chart that silently asks for privileged containers is a chart that
    # gets rejected in review.
    enabled: false
    provider: obi
    privileged: true

# Log collection: a DaemonSet-mode collector that tails container stdout/
# stderr from every node and ships it to backends.logs. This is separate from
# `collector` above (which is Deployment-mode and only accepts telemetry
# actively pushed to it via OTLP) because reading node-local log files needs a
# pod on every node with a hostPath mount — a different shape of workload.
#
# Off by default, matching this file's bring-your-own posture: turn it on
# once backends.logs points somewhere real, or use values-quickstart.yaml
# which enables it. See docs/getting-signals-into-grafana.md.
logsCollector:
  enabled: false
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

# The collector every injected agent exports to. Disable it if you already run
# one and set backends.traces.otlpEndpoint to its address.
collector:
  enabled: true
  replicas: 2
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Policy — guardrails developers cannot exceed. The compiler enforces these.
# ---------------------------------------------------------------------------
policy:
  maxSeriesPerService: 25000
  minSamplingRate: 0.01
  maxSamplingRate: 1.0
  # Off by default so `discover | synth` works on a cluster whose workloads
  # carry no ownership labels yet. Turn it on once teams are labelled.
  requireTeamLabel: false
  maxRouteCardinality: 200
  denyLabels:
    - user_id
    - email
    - session_id
    - request_id

# ---------------------------------------------------------------------------
# Defaults applied to any service that declares no SLOs of its own.
# ---------------------------------------------------------------------------
defaults:
  environment: production
  slo:
    availability: 99.9
    latency:
      objective: 99.0
      threshold: 500ms
  retention:
    traces: 7d
    metrics: 30d

# ---------------------------------------------------------------------------
# GPU / DCGM cluster-level monitoring — off by default.
#
# This assumes dcgm-exporter is ALREADY installed and running — typically by
# the NVIDIA GPU Operator, sometimes as a standalone chart. Lantern does not
# install or manage dcgm-exporter itself, the same way it doesn't install
# node-exporter (see README "System metrics"). Turning this on only adds a
# ServiceMonitor pointed at your existing dcgm-exporter Service, plus a
# bundled PrometheusRule of GPU health alerts (thermal, uncorrectable ECC,
# XID, power headroom). Neither restarts pods or touches running services.
#
# Per-service GPU/inference SLOs (ttft, inter-token latency, queue depth) are
# a separate, per-ServiceObservability concern handled by the compiler, not
# this chart — see serviceKind: inference and type: saturation in
# docs/gpu-and-inference-observability.md. Those need dcgm-exporter's own
# Kubernetes pod-mapping feature (DCGM_EXPORTER_KUBERNETES=true, set on
# dcgm-exporter itself — not a value here) so its series carry pod/namespace
# labels a ServiceObservability's selector can match against.
# ---------------------------------------------------------------------------
gpuMonitoring:
  enabled: false
  dcgmExporter:
    # Defaults match the NVIDIA GPU Operator's own naming. Check
    # `kubectl get svc -A -l app=nvidia-dcgm-exporter` if yours differs.
    namespace: gpu-operator
    selector:
      app: nvidia-dcgm-exporter
    port: metrics
  alerts:
    enabled: true
    # Defaults follow NVIDIA's own published guidance for these signals;
    # override per fleet if yours differs.
    thermalCriticalC: 85
    powerHeadroomPercent: 5

# ---------------------------------------------------------------------------
# Subcharts — all off. See values-quickstart.yaml.
# ---------------------------------------------------------------------------
opentelemetry-operator:
  enabled: false
  # These two defaults apply whenever this subchart is turned on, quickstart
  # or a BYO partial install alike — both were found causing real installs
  # to fail against a live cluster with no cert-manager on it.
  admissionWebhooks:
    certManager:
      # The chart's own default is true, which requires cert-manager to
      # already be running on the cluster for the webhook's TLS cert. Most
      # clusters adopting Lantern for the first time don't have cert-manager
      # installed (this one didn't) and installing it too is a whole
      # separate operator/CRD footprint just to get a webhook cert. false
      # falls through to the chart's own autoGenerateCert path below instead.
      enabled: false
    autoGenerateCert:
      enabled: true
      # The chart's own default is true, which regenerates a brand-new
      # self-signed CA/cert on every `helm upgrade` — but nothing in the
      # chart restarts the already-running operator pod to pick up the new
      # cert, so the pod keeps serving the old one while the webhook
      # configs now trust the new CA. Found on a real `helm upgrade`
      # immediately after a clean install: "certificate signed by unknown
      # authority" on the very next apply, for every apply after that,
      # forever. false makes the chart look up and reuse any existing
      # secret instead (see the upstream chart's genCert helper), so the
      # cert only gets generated once, on first install.
      recreate: false
kube-prometheus-stack:
  enabled: false
tempo:
  enabled: false
loki:
  enabled: false
