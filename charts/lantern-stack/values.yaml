# Default posture: BRING YOUR OWN BACKEND.
#
# Nothing is installed. The chart renders an ObservabilityStack describing the
# backends you already run, and deploys a collector that forwards to them.
# This is what a company with an existing Prometheus and Grafana wants.
#
# For an empty cluster, use values-quickstart.yaml instead.

namespace: observability

# Read-only safety gate, on by default. See scripts/preflight-check.sh for the
# authoritative version (run before `helm install`, not just inside it) and
# templates/preflight-hook.yaml for what this in-cluster copy actually covers
# and does not.
preflight:
  hook:
    enabled: true

# ---------------------------------------------------------------------------
# Backends
#
# When the matching subchart is enabled, these are ignored and the in-cluster
# service addresses are used instead. See templates/_helpers.tpl.
# ---------------------------------------------------------------------------
backends:
  metrics:
    type: prometheus
    remoteWrite: ""      # e.g. http://mimir.observability:9009/api/v1/push
    queryURL: ""         # e.g. http://prometheus.observability:9090
    operator: prometheus-operator
    datasource: ""       # Grafana datasource uid, used by P1 dashboards
    ruleNamespace: ""    # defaults to each service's own namespace
  traces:
    type: tempo
    otlpEndpoint: ""     # e.g. tempo.observability:4317
    datasource: ""
  logs:
    type: loki
    endpoint: ""         # e.g. http://loki.observability:3100
    datasource: ""
  dashboards:
    type: grafana
    folderStrategy: per-team
    instanceRef:
      name: ""
      namespace: ""
    instanceLabels:
      dashboards: main

# ---------------------------------------------------------------------------
# Instrumentation
# ---------------------------------------------------------------------------
instrumentation:
  provider: otel-operator   # otel-operator | odigos | none
  ebpf:
    # eBPF requires privileged access. It is opt-in, never a default, because
    # a chart that silently asks for privileged containers is a chart that
    # gets rejected in review.
    enabled: false
    provider: obi
    privileged: true

# Log collection: a DaemonSet-mode collector that tails container stdout/
# stderr from every node and ships it to backends.logs. This is separate from
# `collector` above (which is Deployment-mode and only accepts telemetry
# actively pushed to it via OTLP) because reading node-local log files needs a
# pod on every node with a hostPath mount — a different shape of workload.
#
# Off by default, matching this file's bring-your-own posture: turn it on
# once backends.logs points somewhere real, or use values-quickstart.yaml
# which enables it. See docs/getting-signals-into-grafana.md.
logsCollector:
  enabled: false
  image: otel/opentelemetry-collector-contrib:latest
  # 100Mi/200Mi looked reasonable on paper but was too small for real
  # application logs: found on a real cluster where the memory_limiter
  # processor (limit_percentage: 80 of the container's own memory limit,
  # see logs-collector.yaml) started rejecting log batches outright
  # ("data refused due to high memory usage") for any service verbose
  # enough to log full SQL query text per request -- silently, with the
  # affected pods' log lines just never showing up in Loki, no error
  # visible anywhere except this collector's own pod logs. 256Mi/512Mi
  # gives real headroom for that kind of burst without needing a restart
  # of anything on the application side once raised.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# The collector every injected agent exports to. Disable it if you already run
# one and set backends.traces.otlpEndpoint to its address.
collector:
  enabled: true
  replicas: 2
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Policy — guardrails developers cannot exceed. The compiler enforces these.
# ---------------------------------------------------------------------------
policy:
  maxSeriesPerService: 25000
  minSamplingRate: 0.01
  maxSamplingRate: 1.0
  # Off by default so `discover | synth` works on a cluster whose workloads
  # carry no ownership labels yet. Turn it on once teams are labelled.
  requireTeamLabel: false
  maxRouteCardinality: 200
  denyLabels:
    - user_id
    - email
    - session_id
    - request_id

# ---------------------------------------------------------------------------
# Defaults applied to any service that declares no SLOs of its own.
# ---------------------------------------------------------------------------
defaults:
  environment: production
  slo:
    availability: 99.9
    latency:
      objective: 99.0
      threshold: 500ms
  retention:
    traces: 7d
    metrics: 30d

# ---------------------------------------------------------------------------
# GPU / DCGM cluster-level monitoring — off by default.
#
# Default assumption: dcgm-exporter is ALREADY installed and running —
# typically by the NVIDIA GPU Operator, sometimes as a standalone chart.
# Lantern does not install or manage the GPU Operator itself (driver,
# container toolkit, device plugin are node-level infrastructure well outside
# this project's scope) — but see installExporter below for the one narrow
# case where Lantern *will* install just the exporter.
#
# Turning gpuMonitoring.enabled on adds a ServiceMonitor pointed at
# dcgm-exporter's Service, plus a bundled PrometheusRule of GPU health alerts
# (thermal, uncorrectable ECC, XID, power headroom). Neither restarts pods or
# touches running services.
#
# Per-service GPU/inference SLOs (ttft, inter-token latency, queue depth) are
# a separate, per-ServiceObservability concern handled by the compiler, not
# this chart — see serviceKind: inference and type: saturation in
# docs/gpu-and-inference-observability.md. Those need dcgm-exporter's own
# Kubernetes pod-mapping feature (DCGM_EXPORTER_KUBERNETES=true, set on
# dcgm-exporter itself — not a value here) so its series carry pod/namespace
# labels a ServiceObservability's selector can match against.
# ---------------------------------------------------------------------------
gpuMonitoring:
  enabled: false

  # installExporter: true has Lantern install ONLY the dcgm-exporter chart
  # (the `dcgm-exporter:` subchart block below), not the GPU Operator, not a
  # driver, not the container toolkit. It exists for the specific gap this
  # project can close safely: GPU nodes that already run real GPU workloads
  # (driver + device plugin proven working — something has already been
  # scheduled against the nvidia.com/gpu extended resource) but have no
  # dcgm-exporter on them yet.
  #
  # `scripts/preflight-check.sh --gpu-install-exporter` enforces the gate:
  # it BLOCKs if no node in the cluster currently advertises
  # `nvidia.com/gpu` as allocatable, because that's the only cluster-visible
  # proof the driver and device plugin are actually functional. Don't flip
  # this on without running that check first — `lantern init` (which offers
  # this as a sub-question) can't see the live cluster to check it for you.
  #
  # When false (the default), dcgmExporter.* below describes where your
  # OWN, externally-installed dcgm-exporter lives instead.
  installExporter: false

  dcgmExporter:
    # Defaults match the NVIDIA GPU Operator's own naming, for the
    # installExporter: false (bring-your-own) case. Check
    # `kubectl get svc -A -l app=nvidia-dcgm-exporter` if yours differs.
    #
    # When installExporter: true, templates/gpu-monitoring.yaml ignores these
    # three and computes the real values instead (the dcgm-exporter chart's
    # own labels/namespace, deterministic from .Release.Name) — left here
    # only as the bring-your-own default.
    namespace: gpu-operator
    selector:
      app: nvidia-dcgm-exporter
    port: metrics
  alerts:
    enabled: true
    # Defaults follow NVIDIA's own published guidance for these signals;
    # override per fleet if yours differs.
    thermalCriticalC: 85
    powerHeadroomPercent: 5

  # Fleet-wide health dashboard (templates/gpu-dashboard.yaml) — utilization,
  # memory-copy, temperature (with the same thermalCriticalC threshold line
  # the alert above uses), power draw vs. cap, ECC/XID error tables. Alerts
  # alone tell you something's wrong; this is the "what does the fleet
  # actually look like right now" view alerts don't cover.
  dashboard:
    enabled: true
    # Must match whatever Prometheus datasource UID your Grafana actually has
    # — "prometheus" is kube-prometheus-stack's own default (see
    # values-quickstart.yaml), not something this chart can discover for a
    # bring-your-own Grafana.
    datasourceUID: prometheus

# ---------------------------------------------------------------------------
# Subcharts — all off. See values-quickstart.yaml.
# ---------------------------------------------------------------------------
opentelemetry-operator:
  enabled: false
  # These two defaults apply whenever this subchart is turned on, quickstart
  # or a BYO partial install alike — both were found causing real installs
  # to fail against a live cluster with no cert-manager on it.
  admissionWebhooks:
    certManager:
      # The chart's own default is true, which requires cert-manager to
      # already be running on the cluster for the webhook's TLS cert. Most
      # clusters adopting Lantern for the first time don't have cert-manager
      # installed (this one didn't) and installing it too is a whole
      # separate operator/CRD footprint just to get a webhook cert. false
      # falls through to the chart's own autoGenerateCert path below instead.
      enabled: false
    autoGenerateCert:
      enabled: true
      # The chart's own default is true, which regenerates a brand-new
      # self-signed CA/cert on every `helm upgrade` — but nothing in the
      # chart restarts the already-running operator pod to pick up the new
      # cert, so the pod keeps serving the old one while the webhook
      # configs now trust the new CA. Found on a real `helm upgrade`
      # immediately after a clean install: "certificate signed by unknown
      # authority" on the very next apply, for every apply after that,
      # forever. false makes the chart look up and reuse any existing
      # secret instead (see the upstream chart's genCert helper), so the
      # cert only gets generated once, on first install.
      recreate: false
kube-prometheus-stack:
  enabled: false
tempo:
  enabled: false
loki:
  enabled: false

# Only installed when gpuMonitoring.installExporter is true (see the comment
# there) — this is the narrow, exporter-only alternative to the full NVIDIA
# GPU Operator. Values here are Lantern's own overrides on top of the
# upstream chart's defaults (https://github.com/NVIDIA/dcgm-exporter,
# deployment/values.yaml) — anything not listed below keeps that chart's own
# default.
dcgm-exporter:
  enabled: false

  # REQUIRED before turning gpuMonitoring.installExporter on: leaving this
  # empty schedules the exporter DaemonSet onto EVERY node in the cluster,
  # including ones with no GPU, where it will CrashLoopBackOff (no
  # /dev/nvidia* to talk to). There is no universal label for "this is a GPU
  # node" — it depends on how your device plugin/NFD is set up.
  # `scripts/preflight-check.sh --gpu-install-exporter` prints the label(s)
  # actually present on the nodes advertising nvidia.com/gpu on THIS
  # cluster; copy the real one here rather than guessing.
  nodeSelector: {}

  # Safe as an always-on default, unlike nodeSelector above: a toleration
  # only permits scheduling onto tainted nodes, it doesn't cause it. If your
  # GPU nodes aren't tainted this way, it's simply unused.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  # This chart ships its own ServiceMonitor by default. Lantern's own
  # templates/gpu-monitoring.yaml already provides one (bundled with the
  # PrometheusRule alerts, in one documented place) — turning this on too
  # would create two ServiceMonitors scraping the same pods.
  serviceMonitor:
    enabled: false

  # Gets pod/namespace/container labels onto DCGM series automatically, the
  # thing docs/gpu-and-inference-observability.md otherwise walks you through
  # enabling by hand (DCGM_EXPORTER_KUBERNETES=true on a bring-your-own
  # install) — needed for the per-service GPU saturation SLO join described
  # there. Verify the label names this chart version actually emits against
  # a live cluster before trusting a saturation SLO selector on them; the
  # same caution the docs give for the manual path applies here too.
  kubernetes:
    enablePodLabels: true
